<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chambre à Brouillard Interactive — Physique des Particules</title>
  <!-- Load p5.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <!-- Tailwind CSS CDN for modern, clean UI design -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom CSS adjustments for dark theme */
    body {
      background-color: #030712;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      user-select: none;
    }

    /* Style numeric sliders for smooth thumb dragging */
    input[type=range] {
      accent-color: #38bdf8;
    }

    /* Hide standard chrome number spinners for clean custom UI */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    canvas {
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8), 0 0 20px 2px rgba(56, 189, 248, 0.15);
      border-radius: 12px;
      display: block;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 md:p-6">

  <!-- Top Navigation & Header -->
  <header class="w-full max-w-5xl mb-4 text-center md:text-left flex flex-col md:flex-row items-center justify-between border-b border-slate-800 pb-3 gap-2">
    <div>
      <h1 class="text-2xl font-bold tracking-tight text-sky-400 flex items-center gap-2">
        <svg class="w-6 h-6 text-sky-400 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        Chambre à Brouillard 
      </h1>
      <p class="text-xs text-slate-400">Simulation physique de la condensation d'isopropanol sur le passage de particules ionisantes</p>
    </div>
    <div class="text-xs text-slate-500 bg-slate-900/80 px-3 py-1.5 rounded-full border border-slate-800">
      <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>
      Refroidissement actif (-40°C)
    </div>
  </header>

  <!-- Control Dashboard -->
  <main class="w-full max-w-5xl flex flex-col items-center gap-4">
    
    <!-- UI Control Panel -->
    <div class="w-full bg-slate-900/90 backdrop-blur border border-slate-800 rounded-xl p-4 shadow-xl flex flex-wrap lg:flex-nowrap gap-5 items-stretch justify-between">
      
      <!-- 1. Radioactive Source Selector -->
      <div class="flex-1 min-w-[220px] flex flex-col justify-between bg-slate-950/60 p-3 rounded-lg border border-slate-800/80">
        <label for="sourceSelect" class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
          <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
          Terme source 
        </label>
        <select id="sourceSelect" class="w-full bg-slate-800 text-slate-100 border border-slate-700 rounded-md px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-sky-500 focus:outline-none transition cursor-pointer">
          <option value="none">Aucune </option>
          <option value="u238" selected>Uranium-238 (Alpha α + Bêta β-) </option>
          <option value="sr90">Strontium-90 (Bêta β-)</option>
          <option value="co60">Cobalt-60 (Bêta β- + Gamma γ)</option>
          <option value="am241">Americium-241 (Alpha α)</option>
          <option value="ra226">Radium-226 (Alpha α + Bêta β-)</option>
        </select>
      </div>

      <!-- 2. Ergonomic Activity Control (Strictly capped to 10 Bq) -->
      <div class="flex-1 min-w-[240px] flex flex-col justify-between bg-slate-950/60 p-3 rounded-lg border border-slate-800/80">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Activité (Bq)</span>
          <span class="text-xs text-amber-400 font-mono">Max: 10 Bq</span>
        </div>
        
        <div class="flex items-center gap-2 my-1">
          <input type="range" id="activitySlider" min="0" max="10" step="1" value="3" class="w-full h-2 bg-slate-700 rounded-lg cursor-pointer">
          <div class="flex items-center bg-slate-800 border border-slate-700 rounded px-1.5 py-0.5 min-w-[64px]">
            <input type="number" id="activityInput" min="0" max="10" step="1" value="3" class="w-10 bg-transparent text-center text-sm font-bold text-sky-400 focus:outline-none">
            <span class="text-xs text-slate-400 select-none">Bq</span>
          </div>
        </div>

        <div class="flex items-center justify-between gap-1 text-[11px]">
          <button onclick="setActivity(0)" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-0.5 rounded transition">0 (Off)</button>
          <button onclick="setActivity(3)" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-0.5 rounded transition">3 Bq</button>
          <button onclick="setActivity(6)" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-0.5 rounded transition">6 Bq</button>
          <button onclick="setActivity(10)" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-0.5 rounded transition font-semibold text-sky-400">10 Bq</button>
        </div>
      </div>

      <!-- 3. Ergonomic Magnetic Field Control (B Field) -->
      <div class="flex-1 min-w-[260px] flex flex-col justify-between bg-slate-950/60 p-3 rounded-lg border border-slate-800/80">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Champ Magnétique B</span>
          <button onclick="setBField(0)" class="text-[10px] bg-rose-950/60 hover:bg-rose-900 border border-rose-800/80 text-rose-300 px-2 py-0.5 rounded transition flex items-center gap-1">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            RAZ (0 T)
          </button>
        </div>
        <div class="flex items-center gap-2 my-1">
          <input type="range" id="bSlider" min="-50" max="50" step="1" value="20" class="w-full h-2 bg-slate-700 rounded-lg cursor-pointer">
          <div class="flex items-center bg-slate-800 border border-slate-700 rounded px-1.5 py-0.5 min-w-[70px]">
            <input type="number" id="bInput" min="-50" max="50" step="1" value="0" class="w-11 bg-transparent text-center text-sm font-bold text-sky-400 focus:outline-none">
            <span class="text-xs text-slate-400 select-none">T</span>
          </div>
        </div>

        <div class="flex items-center justify-between gap-1 text-[11px]">
          <button onclick="adjustBField(-10)" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-0.5 rounded transition">-10 T</button>
          <button onclick="adjustBField(-1)" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-0.5 rounded transition">-1 T</button>
          <button onclick="adjustBField(1)" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-0.5 rounded transition">+1 T</button>
          <button onclick="adjustBField(10)" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-0.5 rounded transition">+10 T</button>
        </div>
      </div>

      <!-- 4. Cosmic Ray Toggle & Reset -->
      <div class="flex flex-col justify-between gap-2 min-w-[170px] bg-slate-950/60 p-3 rounded-lg border border-slate-800/80">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Environnement</span>
        
        <button id="cosmicBtn" onclick="toggleCosmic()" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-semibold py-2 px-3 rounded-md transition flex items-center justify-center gap-2">
          <span id="cosmicDot" class="w-2.5 h-2.5 rounded-full bg-slate-500"></span>
          Rayonnement cosmique (Muons μ)
        </button>

        <button onclick="clearDroplets()" class="w-full bg-slate-800/60 hover:bg-slate-700 border border-slate-700/60 text-slate-400 hover:text-slate-200 text-xs py-1.5 px-3 rounded-md transition flex items-center justify-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          Effacer Traces
        </button>
      </div>

    </div>

    <!-- Canvas Container -->
    <div id="canvas-container" class="relative w-full flex justify-center items-center">
      <!-- Overlay badges for simulation context -->
      <div id="legendBadge" class="absolute bottom-3 left-4 pointer-events-none bg-slate-950/80 border border-slate-800 text-slate-400 text-xs px-3 py-1.5 rounded-md backdrop-blur flex items-center gap-3">
        <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-white opacity-90 inline-block"></span> Alpha (Trajectoire Courte/Épaisse)</span>
        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-sky-300 opacity-80 inline-block"></span> Bêta ( " Fine/Sinueuse)</span>
        <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-400 opacity-80 inline-block"></span> Muon (Épars)</span>
      </div>
    </div>

  </main>

  <script>
    // Global simulation state variables
    let particles = [];
    let droplets = [];
    let cosmicActive = false;

    // Synchronize UI Controls (Activity & Magnetic Field B)
    const activitySlider = document.getElementById('activitySlider');
    const activityInput = document.getElementById('activityInput');
    const bSlider = document.getElementById('bSlider');
    const bInput = document.getElementById('bInput');

    // Sync Activity Slider -> Input
    activitySlider.addEventListener('input', (e) => {
      let val = Math.min(10, Math.max(0, parseInt(e.target.value) || 0));
      activityInput.value = val;
    });
    // Sync Activity Input -> Slider (with strict max limit of 10 Bq)
    activityInput.addEventListener('input', (e) => {
      let val = parseInt(e.target.value);
      if (isNaN(val)) val = 0;
      if (val > 10) val = 10;
      if (val < 0) val = 0;
      activityInput.value = val;
      activitySlider.value = val;
    });

    // Sync B Slider -> Input
    bSlider.addEventListener('input', (e) => {
      let val = Math.min(50, Math.max(-50, parseFloat(e.target.value) || 0));
      bInput.value = val;
    });
    // Sync B Input -> Slider
    bInput.addEventListener('input', (e) => {
      let val = parseFloat(e.target.value);
      if (isNaN(val)) val = 0;
      if (val > 50) val = 50;
      if (val < -50) val = -50;
      bInput.value = val;
      bSlider.value = val;
    });

    // Helper functions for UI button actions
    function setActivity(val) {
      val = Math.min(10, Math.max(0, val));
      activitySlider.value = val;
      activityInput.value = val;
    }

    function setBField(val) {
      val = Math.min(50, Math.max(-50, val));
      bSlider.value = val;
      bInput.value = val;
    }

    function adjustBField(delta) {
      let current = parseFloat(bInput.value) || 0;
      setBField(current + delta);
    }

    function clearDroplets() {
      droplets = [];
      particles = [];
    }

    function toggleCosmic() {
      cosmicActive = !cosmicActive;
      const btn = document.getElementById('cosmicBtn');
      const dot = document.getElementById('cosmicDot');
      
      if (cosmicActive) {
        btn.classList.add('bg-sky-600', 'border-sky-500', 'text-white');
        btn.classList.remove('bg-slate-800', 'border-slate-700', 'text-slate-200');
        dot.classList.add('bg-emerald-400', 'animate-pulse');
        dot.classList.remove('bg-slate-500');
      } else {
        btn.classList.remove('bg-sky-600', 'border-sky-500', 'text-white');
        btn.classList.add('bg-slate-800', 'border-slate-700', 'text-slate-200');
        dot.classList.remove('bg-emerald-400', 'animate-pulse');
        dot.classList.add('bg-slate-500');
      }
    }

    // p5.js Initialization Setup
    function setup() {
      // Responsive canvas sizing
      let containerWidth = document.getElementById('canvas-container').clientWidth;
      let canvasHeight = Math.min(560, Math.max(400, window.innerHeight - 260));
      let canvas = createCanvas(containerWidth, canvasHeight);
      canvas.parent('canvas-container');
    }

    function windowResized() {
      let containerWidth = document.getElementById('canvas-container').clientWidth;
      let canvasHeight = Math.min(560, Math.max(400, window.innerHeight - 260));
      resizeCanvas(containerWidth, canvasHeight);
    }

    function draw() {
      // Dark chamber base (super-saturated alcohol vapor volume above cold plate)
      background(8, 12, 22);

      let source = document.getElementById('sourceSelect').value;
      let activity = parseInt(activityInput.value) || 0;
      activity = Math.min(10, Math.max(0, activity)); // Enforce hard cap

      // 1. Draw radioactive source capsule in chamber center
      if (source !== 'none') {
        drawSourceCapsule();
      }

      // 2. Radioactive decays from source
      if (source !== 'none' && activity > 0 && frameCount % max(1, floor(60 / activity)) === 0) {
        if (source === 'am241') {
          spawnFromSource('alpha');
        } else if (source === 'sr90') {
          spawnFromSource('beta');
        } else if (source === 'co60') {
          spawnFromSource('beta');
        } else if (source === 'u238') {
          spawnFromSource(random() > 0.2 ? 'alpha' : 'beta');
        } else if (source === 'ra226') {
          spawnFromSource(random() > 0.35 ? 'alpha' : 'beta');
        }
      }

      // 3. Omnidirectional Cosmic Muons (3D cross-sections emerging everywhere)
      if (cosmicActive && frameCount % 14 === 0) {
        spawnCosmicMuon();
      }

      let B_field = parseFloat(bInput.value) || 0;

      // 4. Update and render condensed alcohol droplets (Top-down view: stationary on cold bottom)
      for (let i = droplets.length - 1; i >= 0; i--) {
        droplets[i].update();
        droplets[i].draw();
        if (droplets[i].isDead()) {
          droplets.splice(i, 1);
        }
      }

      // 5. Update active particle trajectories with Lorentz deflection and energy loss
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.update(B_field);
        if (!p.active) {
          particles.splice(i, 1);
        }
      }
    }

    // Render central isotope holder
    function drawSourceCapsule() {
      let cx = width / 2;
      let cy = height / 2;

      noStroke();
      // Ionization glow halo
      fill(245, 158, 11, 20);
      circle(cx, cy, 38);

      // Metallic mount
      fill(71, 85, 105);
      stroke(148, 163, 184);
      strokeWeight(1.5);
      circle(cx, cy, 20);

      // Active isotope core
      noStroke();
      fill(239, 68, 68);
      circle(cx, cy, 8);
    }

    // Particle factory from central source
    function spawnFromSource(type) {
      let energy = (type === 'alpha') ? 140 : 65;
      particles.push(new Particle(type, width / 2, height / 2, random(TWO_PI), energy));
    }

    // Cosmic ray factory (spawns anywhere in 2D projection, typing 3D volume crossings)
    function spawnCosmicMuon() {
      let x, y, angle;
      // 50% chance crossing through borders, 50% chance emerging within volume (high zenith angle)
      if (random() < 0.5) {
        x = random(width);
        y = random(height);
        angle = random(TWO_PI);
      } else {
        let side = floor(random(4));
        if (side === 0) { x = random(width); y = 0; angle = random(PI/6, 5*PI/6); }
        else if (side === 1) { x = width; y = random(height); angle = random(2*PI/3, 4*PI/3); }
        else if (side === 2) { x = random(width); y = height; angle = random(7*PI/6, 11*PI/6); }
        else { x = 0; y = random(height); angle = random(-PI/3, PI/3); }
      }

      let energy = random(100, 240);
      particles.push(new Particle('muon', x, y, angle, energy));
    }

    // Particle Class representing ionizing radiation
    class Particle {
      constructor(type, x, y, angle, energy) {
        this.type = type;
        this.pos = createVector(x, y);
        this.initialEnergy = energy;
        this.energy = energy;

        if (type === 'alpha') {
          this.charge = 2;          // He-4 nucleus (+2e)
          this.mass = 320;          // Heavy mass -> minimal deflection
          this.scattering = 0.004;  // Very straight trajectory
        } else if (type === 'beta') {
          this.charge = -1;         // Electron (-1e)
          this.mass = 1.2;          // Light mass -> strong curvature & scattering
          this.scattering = 0.16;   // Frequent multiple coulomb scattering
        } else if (type === 'muon') {
          this.charge = random() > 0.5 ? 1 : -1; // Relativistic cosmic muon
          this.mass = 90;           // Intermediate mass -> slight curvature
          this.scattering = 0.001;  // Almost perfectly straight
        }

        let speed = sqrt((2 * this.energy) / this.mass);
        this.vel = p5.Vector.fromAngle(angle).mult(speed);
        this.active = true;
      }

      update(B) {
        if (!this.active || this.energy <= 0) {
          this.active = false;
          return;
        }

        // Lorentz Force simulation: F = q * (v x B) -> Perpendicular acceleration
        let perp = createVector(-this.vel.y, this.vel.x).normalize();
        let speed = this.vel.mag();
        let accelMag = (this.charge * B * speed * 0.035) / this.mass;
        this.vel.add(perp.mult(accelMag));

        // Multiple Coulomb scattering
        if (this.scattering > 0) {
          this.vel.rotate(random(-this.scattering, this.scattering));
        }

        // Energy loss per unit path length (dE/dx - Bragg Peak behavior for Alpha)
        let dE = 0;
        if (this.type === 'alpha') {
          // Bragg Peak: Ionization increases sharply as the alpha particle slows down
          dE = 0.58 / sqrt((this.energy / this.initialEnergy) + 0.04);
        } else if (this.type === 'beta') {
          dE = 0.32;
        } else if (this.type === 'muon') {
          dE = 0.14;
        }

        this.energy -= dE;

        if (this.energy <= 0) {
          this.active = false;
        } else {
          this.vel.setMag(sqrt((2 * max(0, this.energy)) / this.mass));
        }

        this.pos.add(this.vel);

        // Condensation droplet nucleation along path
        let dropletCount = (this.type === 'alpha') ? 3 : 1;
        for (let i = 0; i < dropletCount; i++) {
          let offset = p5.Vector.random2D().mult(random(0, 1.8));
          let dropPos = p5.Vector.add(this.pos, offset);
          
          let radius = (this.type === 'alpha') ? random(3.5, 6.5) : (this.type === 'beta' ? random(1.0, 2.2) : random(2.0, 3.8));
          
          // Bragg peak visual thickening near end of alpha track
          if (this.type === 'alpha' && this.energy < this.initialEnergy * 0.22) {
            radius *= 2.3;
          }

          droplets.push(new Droplet(dropPos.x, dropPos.y, radius, this.type));
        }

        // Deactivate if out of canvas bounds
        if (this.pos.x < 0 || this.pos.x > width || this.pos.y < 0 || this.pos.y > height) {
          this.active = false;
        }
      }
    }

    // Droplet Class (Top-Down View: droplets rest on cold bottom plate and evaporate)
    class Droplet {
      constructor(x, y, r, type) {
        this.x = x;
        this.y = y;
        this.r = r;
        this.type = type;
        this.alpha = 230; // Initial opacity
        this.fadeRate = random(1.4, 2.6); // Progressive evaporation speed
      }

      update() {
        // Evaporation loss (opacity decay)
        this.alpha -= this.fadeRate;
        // Top-down view: NO downward drift vector. Droplets remain stationary.
      }

      draw() {
        noStroke();
        // Color tinting according to particle ionization density
        if (this.type === 'alpha') {
          fill(255, 255, 255, this.alpha);
        } else if (this.type === 'beta') {
          fill(186, 230, 253, this.alpha);
        } else {
          fill(167, 243, 208, this.alpha);
        }

        circle(this.x, this.y, this.r * 2);
      }

      isDead() {
        return this.alpha <= 0;
      }
    }
  </script>
</body>
</html>
